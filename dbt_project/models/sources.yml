version: 2

sources:
  - name: ods
    tables:
      - name: companies
        description: "Компании из ODS"
        columns:
          - name: id
            description: "ID компании"
          - name: name
            description: "Название компании"
          - name: inn
            description: "ИНН компании"
          - name: registration_date
            description: "Дата регистрации компании"
          - name: industry
            description: "Индустрия компании"
          - name: loaded_at
            description: "Время загрузки в ODS"
      - name: contracts
        description: "Договоры из ODS"
        columns:
          - name: id
            description: "ID договора"
          - name: company_id
            description: "ID компании, с которой заключен договор"
          - name: amount
            description: "Сумма договора"
          - name: status
            description: "Статус договора"
          - name: loaded_at
            description: "Время загрузки в ODS"

  - name: dds
    schema: dds
    tables:
      - name: dim_dates
        columns:
          - name: date_sk
            description: "Суррогатный ключ"
          - name: date
            description: "Дата"
          - name: year
            description: "Год"
          - name: quarter
            description: "Квартал"
          - name: month
            description: "Месяц"
          - name: month_name
            description: "Название месяца"
          - name: day
            description: "День"
          - name: day_of_week
            description: "День недели"
          - name: day_name
            description: "Название дня"
          - name: is_weekend
            description: "Выходной"