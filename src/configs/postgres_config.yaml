layers:
  - name: dwh
  
    schemas:
      - name: ods
        tables:
          - name: companies
            pk: id
            dtype:
              id: IntegerType
              name: StringType
              inn: StringType
              registration_date: DateType
              region: StringType
              industry: StringType
              loaded_at: TimestampType
            not_null:
              - id
              - name
              - inn

          - name: contracts
            pk: id
            dtype:
              id: IntegerType
              company_id: IntegerType
              contract_date: DateType
              amount: DecimalType
              status: StringType
              loaded_at: TimestampType
            not_null:
              - id
              - company_id
              - contract_date
              
      - name: dds
        tables:
          - name: dim_companies
            pk: company_sk
            dtype:
              company_sk: Integer
              company_bk: Integer
              name: String(258)
              region: String(100)
              industry: String(100)
              valid_from: Timestamp
              valid_to: Timestamp
              is_current: Boolean
              hash_diff: String(64)

          - name: dim_contracts
            pk: contract_sk
            dtype:
              contract_sk: Integer
              contract_bk: Integer
              company_sk: Integer
              status: String
              valid_from: Timestamp
              valid_to: Timestamp
              is_current: Boolean
              hash_diff: String(64)

          - name: dim_dates
            pk: date_sk
            dtype:
              date_sk: Integer
              date: Date
              year: Integer
              quarter: Integer
              month: Integer
              month_name: String(25)
              day: Integer
              day_of_week: Integer
              day_name: String(25)
              is_weekend: Boolean

          - name: fact_contracts
            pk: fact_contract_sk
            dtype:
              fact_contract_sk: Integer
              company_sk: Integer
              contract_sk: Integer
              date_sk: Integer
              amount: Numeric(10, 2)
              loaded_at: Timestamp